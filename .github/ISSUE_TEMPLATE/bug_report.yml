name: Bug report
description: Report a reproducible problem in VENOMBusiness
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve VENOMBusiness. Do not include secrets, credentials, customer data, or undisclosed security vulnerabilities."
  - type: input
    id: version
    attributes:
      label: VENOMBusiness version
      placeholder: v0.5.1-alpha
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and private/business data before pasting logs.
      render: shell
